version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"   # Vite Dev Server (HMR)
      - "8787:8787"   # Wrangler Dev Server
    volumes:
      # Mount entire project for simplicity
      - .:/app:cached
      # Exclude node_modules and dist (use container's)
      - /app/node_modules
      - /app/dist
      - /app/dist-ssr
    environment:
      - NODE_ENV=development
      - VITE_PHOTOGRAPHER_NAME=${VITE_PHOTOGRAPHER_NAME:-Kateryna Hohol}
      - VITE_PHOTOGRAPHER_BRAND=${VITE_PHOTOGRAPHER_BRAND:-FAMILIENSTORY}
      - VITE_PHOTOGRAPHER_STREET=${VITE_PHOTOGRAPHER_STREET:-Rosenhof 7}
      - VITE_PHOTOGRAPHER_PLZ=${VITE_PHOTOGRAPHER_PLZ:-09111}
      - VITE_PHOTOGRAPHER_ORT=${VITE_PHOTOGRAPHER_ORT:-Chemnitz}
      - VITE_PHOTOGRAPHER_EMAIL=${VITE_PHOTOGRAPHER_EMAIL:-hoholkateryna@gmail.com}
      - VITE_PHOTOGRAPHER_WHATSAPP=${VITE_PHOTOGRAPHER_WHATSAPP:-+49 176 64094869}
      - VITE_PHOTOGRAPHER_INSTAGRAM=${VITE_PHOTOGRAPHER_INSTAGRAM:-@kateryna.familienstory}
      - VITE_PHOTOGRAPHER_INSTAGRAM_URL=${VITE_PHOTOGRAPHER_INSTAGRAM_URL:-https://instagram.com/kateryna.familienstory}
      - VITE_WHATSAPP_MESSAGE=${VITE_WHATSAPP_MESSAGE:-Hallo Kateryna, ich interessiere mich für ein Fotoshooting und würde gern mehr erfahren.}
      - PORTFOLIO_LIGHTROOM_SHARE_URL=${PORTFOLIO_LIGHTROOM_SHARE_URL:-}
    command: >
      sh -c "yarn install && yarn dev"
    networks:
      - familien-network
    restart: unless-stopped
    # Enable HMR WebSocket
    stdin_open: true
    tty: true

networks:
  familien-network:
    driver: bridge
