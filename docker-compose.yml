services:
  app:
    image: node:24-bookworm
    working_dir: /app
    command:
      - sh
      - -c
      - corepack enable && corepack prepare yarn@1.22.22 --activate && yarn install --frozen-lockfile && yarn dev:worker
    networks:
      default:
        aliases:
          - worker
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Worker variables (e.g. PORTFOLIO_LIGHTROOM_SHARE_URL) are read from
    # ./.env by `wrangler dev --env-file .env` (see package.json dev:worker).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  smoke:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    profiles:
      - test
    depends_on:
      app:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://worker:8787
      NO_PROXY: worker,app,localhost,127.0.0.1
      no_proxy: worker,app,localhost,127.0.0.1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["yarn", "test:e2e"]

volumes:
  node_modules:
